<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git – visuell guide</title>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#1d1d1f; --muted:#62666d; --line:#dedbd1;
  --accent:#4f46e5;
  --changed:#f59e0b; --changed-bg:#fff4dc;
  --staged:#16a34a;  --staged-bg:#e2f6e8;
  --commit:#7c3aed;  --commit-bg:#efe7fd;
  --remote:#0284c7;  --remote-bg:#e0f2fd;
  --code-bg:#14161a; --code-ink:#e8e8ea;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15161a; --card:#1f2127; --ink:#f0f0f2; --muted:#a0a4ac; --line:#363942;
    --accent:#8b86ff;
    --changed-bg:#3a2d10; --staged-bg:#12301d; --commit-bg:#2a1f47; --remote-bg:#0f2e42;
    --code-bg:#0c0d10;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:22px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* val av lektion och verktyg */
.picker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.picker .lbl{font-weight:600;margin-right:4px;min-width:104px}
.tab,.ltab{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:600}
.tab[aria-selected="true"],.ltab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* scenen */
.stage{position:relative;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.box{flex:1 1 0;min-width:0;border:2px dashed var(--line);border-radius:14px;padding:10px}
.box-head{text-align:center}
.box-head .ic{font-size:1.9rem;line-height:1.2}
.box-head .nm{font-weight:700}
.box-head .tm{font-size:.8rem;color:var(--muted)}
.box-head .hint{font-size:.78rem;color:var(--muted);margin-top:2px;line-height:1.25}
.slot{min-height:104px;margin-top:10px}
.arrow{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 .76rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);transition:color .3s}
.arrow .glyph{font-size:1.7rem;line-height:1;font-family:system-ui,sans-serif}
.arrow span:last-child{text-align:center;line-height:1.2}
.arrow.on{color:var(--accent)}
.arrow.on .glyph{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(7px)}}
@keyframes nudgeV{0%,100%{transform:rotate(90deg) translateX(0)}50%{transform:rotate(90deg) translateX(7px)}}

#items{position:absolute;inset:0;pointer-events:none}
.item{position:absolute;left:0;top:0;height:78px;padding:8px 10px;border-radius:12px;border:2px solid;
  display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;will-change:transform;
  transition:transform .9s cubic-bezier(.25,.8,.25,1),width .5s,opacity .45s,background-color .4s,border-color .4s}
.item .t{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.78rem;color:var(--muted);line-height:1.2;max-height:2.4em;overflow:hidden}
.item .b{font-size:.74rem;font-weight:700}
.item.changed{background:var(--changed-bg);border-color:var(--changed)}
.item.staged{background:var(--staged-bg);border-color:var(--staged)}
.item.commit{background:var(--commit-bg);border-color:var(--commit)}
.item.remote{background:var(--remote-bg);border-color:var(--remote)}
.item.changed .b{color:var(--changed)} .item.staged .b{color:var(--staged)}
.item.commit .b{color:var(--commit)}   .item.remote .b{color:var(--remote)}
.item.pop{animation:pop .6s}
@keyframes pop{0%{scale:1}40%{scale:1.1}100%{scale:1}}
.no-anim .item{transition:none !important}

/* grenar (SVG) */
.stage.branches{display:block;padding:8px 8px 4px}
.stage svg{width:100%;height:auto;display:block}
.c-main{--c:var(--staged)} .c-test{--c:var(--changed)} .c-dev{--c:var(--remote)} .c-feature{--c:var(--commit)}
.lane{opacity:0;transition:opacity .5s}
.lane.show{opacity:1}
.lane line{stroke:var(--line);stroke-width:2;stroke-dasharray:3 7}
.lane .ln{font-size:19px;font-weight:700;fill:var(--c)}
.lane .ld{fill:var(--muted);font-size:13px}
.edge path{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s ease}
.edge.show path{stroke-dashoffset:0}
.edge polygon{fill:var(--c);opacity:0;transition:opacity .3s}
.edge.show polygon{opacity:1;transition-delay:.6s}
.node{opacity:0;transition:opacity .45s}
.node.show{opacity:1;transition-delay:.5s}
.node circle{fill:var(--c);stroke:var(--card);stroke-width:3;transform-box:fill-box;transform-origin:center;transform:scale(.3);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.node.show circle{transform:scale(1);transition-delay:.5s}
.node text{font-size:14px;fill:var(--muted);text-anchor:middle}
.cloud{opacity:0;font-size:20px;text-anchor:middle;transition:opacity .5s}
.cloud.show{opacity:1;transition-delay:.3s}
.tag{opacity:0;font-size:14px;font-weight:700;fill:var(--ink);text-anchor:middle;transition:opacity .5s}
.tag.show{opacity:1;transition-delay:.3s}
.node.ghost circle{fill:var(--card);stroke:var(--c);stroke-width:3;stroke-dasharray:5 4}
.edge.dashed path{stroke-dasharray:.03 .03;stroke-dashoffset:0;opacity:0;transition:opacity .5s}
.edge.dashed.show path{opacity:1}
.elabel{font-size:14px;font-weight:700;fill:var(--ink);text-anchor:middle;opacity:0;transition:opacity .4s;paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.edge.show .elabel{opacity:1;transition-delay:.3s}
.head{transition:transform .8s cubic-bezier(.25,.8,.25,1)}
.head rect{fill:var(--accent)}
.head text{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}

/* kodvy (konflikter) */
.stage.editor{display:block;padding:14px}
.panels{display:grid;gap:12px;grid-template-columns:1fr}
.panels.two{grid-template-columns:1fr 1fr}
.panel{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-weight:700;font-size:.92rem;border-bottom:2px solid var(--line);background:var(--card)}
.br{font-weight:600;font-size:.78rem;padding:1px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.br.theirs{color:var(--remote);border-color:var(--remote)}
.br.mine{color:var(--commit);border-color:var(--commit)}
.br.result{color:var(--staged);border-color:var(--staged)}
.code{padding:8px 0;font:1rem/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cl{display:flex;flex-wrap:wrap;column-gap:12px;align-items:baseline;padding:0 12px;opacity:0;animation:lineIn .45s forwards}
.cl code{font:inherit;white-space:pre-wrap;word-break:break-word}
.cl .nt{margin-left:auto;font:600 .78rem/1.3 system-ui,sans-serif;color:var(--muted)}
.cl.theirs{background:var(--remote-bg);box-shadow:inset 4px 0 var(--remote)}
.cl.mine{background:var(--commit-bg);box-shadow:inset 4px 0 var(--commit)}
.cl.marker{background:var(--changed-bg);color:var(--changed);font-weight:700;box-shadow:inset 4px 0 var(--changed)}
.cl.result{background:var(--staged-bg);box-shadow:inset 4px 0 var(--staged)}
.panel.term{background:var(--code-bg);border-color:var(--code-bg);color:var(--code-ink)}
.panel.term .panel-h{background:#22252c;border-color:#22252c;color:#e8e8ea}
.panel.term .cl.cmdline{color:#8be9a8}
.panel.term .cl.err{color:#ff8a80}
.panel.term .cl .nt{color:#a9adb5}
@keyframes lineIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* kontroller */
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);background:transparent;padding:0}
.dot[aria-current="step"]{background:var(--accent)}
.btn{border:2px solid var(--accent);background:var(--card);color:var(--accent);padding:8px 18px;border-radius:12px;font-weight:700}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.nav{display:flex;gap:8px;align-items:center}

/* förklaring */
.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stepno{font-size:.82rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.info h2{margin:2px 0 6px;font-size:1.35rem}
.info p{margin:0 0 12px}
.cmd{display:flex;align-items:center;gap:10px;background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:10px 12px}
.cmd code{flex:1;font:1.02rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre}
.cmd .note{font-size:.8rem;color:#a9adb5;white-space:nowrap}
.cmd button{background:#2a2d35;color:#e8e8ea;border:0;border-radius:8px;padding:5px 12px;font-size:.85rem}
.cmd[hidden]{display:none}

.toolpanel{margin-top:14px;border-left:5px solid var(--accent);background:var(--card);border-radius:0 14px 14px 0;padding:12px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolpanel .who{font-size:.82rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.toolpanel p{margin:4px 0 0}
kbd{font:.85em ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
.toolpanel code{font:.92em ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:5px;padding:1px 6px}
footer{margin-top:22px;color:var(--muted);font-size:.85rem}

@media (max-width:760px){
  .picker .lbl{min-width:100%}
  .stage:not(.branches){flex-direction:column;padding:12px}
  .box{padding:8px 10px}
  .box-head{display:flex;gap:10px;align-items:center;text-align:left}
  .box-head .ic{font-size:1.6rem}
  .box-head .hint{display:none}
  .slot{min-height:82px;margin-top:8px}
  .arrow{flex:0 0 46px;flex-direction:row;gap:10px}
  .arrow .glyph{transform:rotate(90deg)}
  .arrow.on .glyph{animation:nudgeV 1s ease-in-out infinite}
  .lane .ln{font-size:23px}
  .lane .ld{font-size:16px}
  .node text{font-size:17px}
  .tag,.elabel{font-size:16px}
  .head text{font-size:15px}
  .panels.two{grid-template-columns:1fr}
  .code{font-size:.9rem}
  .cmd .note{display:none}
  .cmd code{white-space:pre-wrap;word-break:break-word}
  .btn{padding:8px 12px;white-space:nowrap}
  .nav{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  .item,.head,.node,.node circle,.edge path,.edge polygon{transition-duration:.01s !important;transition-delay:0s !important}
  .cl{animation:none;opacity:1}
  .arrow.on .glyph,.item.pop{animation:none}
}
</style>
</head>
<body>
<main>
  <h1>Git – visuell guide</h1>
  <p class="lead">Välj lektion och verktyg, och klicka dig igenom. Du ser vad som händer och var du klickar.</p>

  <div class="picker" id="lessons" role="tablist" aria-label="Lektion"><span class="lbl">Lektion:</span></div>
  <div class="picker" id="tools" role="tablist" aria-label="Vilket verktyg använder du?"><span class="lbl">Jag använder:</span></div>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <div class="dots" id="dots"></div>
    <div class="nav">
      <button class="btn" id="play" aria-pressed="false">▶ Spela upp</button>
      <button class="btn" id="prev">← Tillbaka</button>
      <button class="btn primary" id="next">Nästa →</button>
    </div>
  </div>

  <section class="info" aria-live="polite">
    <div class="stepno" id="stepno"></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="cmd" id="cmdbox">
      <code id="cmd"></code><span class="note" id="cmdnote"></span>
      <button id="copy" type="button">Kopiera</button>
    </div>
  </section>

  <section class="toolpanel" id="toolpanel" role="tabpanel">
    <div class="who" id="who"></div>
    <p id="toolbody"></p>
  </section>

  <footer>Lektion 1–8. Menynamn kan skilja något mellan versioner av verktygen.</footer>
</main>

<script>
/* ===================== DATA ===================== */
const TOOLS = [['console','Konsol'],['vscode','VS Code'],['vs','Visual Studio'],['rider','Rider']];

/* ---------- Lektion 1: spara och skicka (scen "places") ---------- */
const L1 = {
  name:'Spara och skicka', scene:'places',
  boxes:[
    {icon:'📁', name:'Din mapp',   term:'working directory', hint:'Här jobbar du med dina filer'},
    {icon:'🛒', name:'Kundvagnen', term:'staging',           hint:'Det som ska med i nästa sparpunkt'},
    {icon:'💾', name:'Din dator',  term:'lokalt repo',       hint:'Dina sparpunkter, bara hos dig'},
    {icon:'☁️', name:'GitHub',     term:'remote',            hint:'Delat med alla'}
  ],
  arrows:['git add','git commit','git push'],
  steps:[
    { title:'Du ändrar en fil',
      text:'Du har skrivit kod och sparat filen i editorn. Git ser att filen är ändrad, men har inte sparat något än.',
      cmd:'git status', note:'visar vad som är ändrat', arrow:-1,
      items:[{id:'f',box:0,cls:'changed',icon:'📄',t:'Program.cs',s:'Ändrad sedan sist',b:'✏️ ändrad'}],
      tools:{
        console:'Skriv <code>git status</code>. Ändrade filer listas under <i>Changes not staged for commit</i>.',
        vscode:'Öppna <b>Källkontroll</b> (<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd>). Filen syns under <b>Changes</b> med ett <b>M</b> (modified).',
        vs:'Öppna <b>Git Changes</b> via <b>Visa → Git Changes</b>. Filen syns under <b>Changes</b>.',
        rider:'Öppna <b>Commit</b>-fönstret (<kbd>Ctrl</kbd>+<kbd>K</kbd>, på Mac <kbd>⌘</kbd>+<kbd>K</kbd>). Filen syns under <b>Changes</b>.'
      }},
    { title:'Lägg i kundvagnen',
      text:'Du väljer vilka ändringar som ska med i nästa sparpunkt. Inget är sparat än, du har bara plockat ut vad som ska med.',
      cmd:'git add Program.cs', note:'lägg i kundvagnen', arrow:0,
      items:[{id:'f',box:1,cls:'staged',icon:'📄',t:'Program.cs',s:'Väntar på sparpunkt',b:'✅ redo'}],
      tools:{
        console:'Skriv <code>git add Program.cs</code>. Vill du ta med allt som ändrats? <code>git add .</code>',
        vscode:'Hovra över filen under <b>Changes</b> och klicka på <b>+</b> (Stage Changes). Filen flyttas till <b>Staged Changes</b>.',
        vs:'Klicka på <b>+</b> bredvid filen i <b>Git Changes</b>. Hoppar du över det tar <b>Commit All</b> med alla ändringar åt dig.',
        rider:'Kryssa i rutan framför filen i Commit-fönstret. Rider har som standard inget eget &quot;add&quot;-steg: kryssrutan <i>är</i> kundvagnen.'
      }},
    { title:'Ta en sparpunkt',
      text:'Nu sparar du det som ligger i kundvagnen som en sparpunkt, med ett meddelande om vad du gjorde. Den finns fortfarande bara på din dator.',
      cmd:'git commit -m "Lägg till inloggning"', note:'skapa sparpunkt', arrow:1,
      items:[{id:'f',box:2,cls:'commit',icon:'💾',t:'Sparpunkt 1',s:'“Lägg till inloggning”',b:'🏠 bara hos dig'}],
      tools:{
        console:'Skriv <code>git commit -m "Lägg till inloggning"</code>. Meddelandet ska beskriva vad du gjorde, så att du förstår det om en vecka.',
        vscode:'Skriv ett meddelande i rutan ovanför filerna och klicka <b>Commit</b> (eller <kbd>Ctrl</kbd>+<kbd>Enter</kbd>).',
        vs:'Skriv ett meddelande i <b>Git Changes</b> och klicka <b>Commit Staged</b> (eller <b>Commit All</b>).',
        rider:'Skriv ett meddelande och klicka <b>Commit</b>. Välj inte <i>Commit and Push</i> än, så att du ser skillnaden mellan stegen.'
      }},
    { title:'Skicka upp till GitHub',
      text:'Nu kopieras sparpunkten till GitHub. Först nu kan andra se den, och du har en säkerhetskopia om datorn skulle dö.',
      cmd:'git push', note:'skicka upp', arrow:2,
      items:[
        {id:'f',box:2,cls:'commit',icon:'💾',t:'Sparpunkt 1',s:'“Lägg till inloggning”',b:'🏠 på din dator'},
        {id:'r',box:3,from:2,cls:'remote',icon:'☁️',t:'Sparpunkt 1',s:'“Lägg till inloggning”',b:'✨ delad'}
      ],
      tools:{
        console:'Skriv <code>git push</code>. Första gången på en ny gren kan Git be dig köra <code>git push -u origin grennamn</code>. Gör som det står.',
        vscode:'Klicka <b>Sync Changes</b> i statusfältet nere till vänster (cirkelpilarna), eller <b>Push</b> via <b>•••</b> i Källkontroll. Obs: Sync gör både hämta och skicka.',
        vs:'Klicka på <b>↑ Push</b> i <b>Git Changes</b>, eller välj <b>Git → Push</b>.',
        rider:'Tryck <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd> (Mac: <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd>) eller välj <b>Git → Push…</b> och klicka <b>Push</b>.'
      }},
    { title:'Klart! Så här gör du varje gång',
      text:'Ändra → lägg i kundvagnen → ta sparpunkt → skicka upp. Upprepa varje gång du har kommit en bit. Små och täta sparpunkter är bättre än få och stora.',
      cmd:null, arrow:'all',
      items:[
        {id:'f',box:2,cls:'commit',icon:'💾',t:'Sparpunkt 1',s:'“Lägg till inloggning”',b:'🏠 på din dator'},
        {id:'r',box:3,cls:'remote',icon:'☁️',t:'Sparpunkt 1',s:'“Lägg till inloggning”',b:'✨ delad'}
      ],
      tools:{
        console:'Genväg: <code>git add .</code> tar med alla ändringar på en gång.',
        vscode:'Pilen bredvid <b>Commit</b> har valet <b>Commit &amp; Push</b> som gör båda i ett svep.',
        vs:'Pilen på commit-knappen har valet <b>Commit All and Push</b>.',
        rider:'<b>Commit and Push…</b> (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>K</kbd>) gör båda på en gång.'
      }}
  ]
};

/* ---------- Lektion 2: grenar (scen "branches") ---------- */
const L2 = {
  name:'Grenar', scene:'branches',
  graph:{
    lanes:[
      {id:'main',    desc:'stabilt', at:0},
      {id:'test',    desc:'testas här',                 at:0},
      {id:'dev',     desc:'samlar färdigt',         at:0},
      {id:'feature', desc:'ditt jobb',             at:1}
    ],
    nodes:[
      {id:'m0',lane:'main',   col:0,t:'Start',   at:0},
      {id:'t0',lane:'test',   col:0,t:'Start',   at:0},
      {id:'d0',lane:'dev',    col:0,t:'',        at:0},
      {id:'f0',lane:'feature',col:0,t:'Start',   at:1},
      {id:'f1',lane:'feature',col:1,t:'Commit 1',at:2},
      {id:'f2',lane:'feature',col:2,t:'Commit 2',at:2},
      {id:'d1',lane:'dev',    col:3,t:'Merge',   at:3},
      {id:'t1',lane:'test',   col:4,t:'Merge',   at:4},
      {id:'m1',lane:'main',   col:5,t:'Merge',   at:5}
    ],
    edges:[
      {from:'d0',to:'f0',c:'feature',at:1},
      {from:'f0',to:'f1',c:'feature',at:2},
      {from:'f1',to:'f2',c:'feature',at:2},
      {from:'d0',to:'d1',c:'dev',at:3},
      {from:'f2',to:'d1',c:'feature',merge:true,at:3},
      {from:'t0',to:'t1',c:'test',at:4},
      {from:'d1',to:'t1',c:'dev',merge:true,at:4},
      {from:'m0',to:'m1',c:'main',at:5},
      {from:'t1',to:'m1',c:'test',merge:true,at:5}
    ],
    clouds:[{node:'m1',at:6},{node:'t1',at:6},{node:'d1',at:6},{node:'f2',at:6}]
  },
  steps:[
    { title:'Spåren i projektet', head:'dev',
      text:'En gren är ett eget spår där du kan jobba utan att störa de andra. Här finns tre från start: main (det som funkar), test (testas här) och dev (samlar det färdiga). Märket “Du är här” visar vilken gren du står på.',
      cmd:'git branch', note:'visar dina grenar',
      tools:{
        console:`<code>git branch</code> listar grenarna. Den med en stjärna (*) är den du står på.`,

      text:'En .gitignore påverkar bara filer som Git inte redan följer. Ligger bin och obj redan i repot måste du säga åt Git att sluta följa dem. Filerna ligger kvar på din disk.',
      cmd:['git rm -r --cached bin obj','git commit -m "Sluta följa bin och obj"'], note:'bort ur Git, inte från disken',
      tools:{
        console:`Kör kommandona. <code>--cached</code> betyder att filerna bara tas bort ur Git, inte från datorn. Pusha sedan som vanligt.`,
        vscode:`Det finns ingen knapp för detta. Använd terminalen (<b>Terminal → New Terminal</b>).`,
        vs:`Det finns ingen knapp för detta. Använd terminalen (<b>Visa → Terminal</b>).`,
        rider:`Använd terminalen (<kbd>Alt</kbd>+<kbd>F12</kbd>) och kör kommandona.`
      },
      panels:[{title:'⌨️ Terminal', kind:'term', lines:[
        {t:'$ git rm -r --cached bin obj', cls:'cmdline'},
        {t:"rm 'bin/Debug/net8.0/Program.dll'", cls:'ctx'},
        {t:"rm 'obj/project.assets.json'", cls:'ctx', note:'… och fler'},
        {t:'$ git commit -m "Sluta följa bin och obj"', cls:'cmdline'},
        {t:'[main 4c1d2e9] Sluta följa bin och obj', cls:'ctx', note:'✅ klart'}
      ]}] },
    { title:'Hemligheter hör inte hemma i repot',
      text:'Lösenord och API-nycklar ska aldrig in i Git. Är de redan pushade räknas de som läckta: byt dem direkt, att radera filen efteråt hjälper inte. I .NET finns user-secrets, som sparar dem utanför projektmappen.',
      cmd:['dotnet user-secrets init','dotnet user-secrets set "ApiKey" "hemligt"'], note:'sparas utanför repot',
      tools:{
        console:`Kör kommandona i projektmappen. I koden läser du värdet med <code>builder.Configuration["ApiKey"]</code>. Varje gruppmedlem sätter sin egen nyckel.`,
        vscode:`Kör kommandona i terminalen (<b>Terminal → New Terminal</b>).`,
        vs:`Högerklicka projektet → <b>Manage User Secrets</b>. Då öppnas en fil som ligger utanför projektmappen.`,
        rider:`Kör kommandona i terminalen (<kbd>Alt</kbd>+<kbd>F12</kbd>).`
      },
      panels:[{title:'📁 Vad ligger var?', badge:{t:'hemligheter', cls:''}, lines:[
        {t:'appsettings.json', cls:'result', note:'✅ i Git: tomma platshållare'},
        {t:'~/.microsoft/usersecrets/…', cls:'result', note:'✅ på din dator: riktiga nycklar'},
        {t:'appsettings.secrets.json', cls:'marker', note:'⛔ riskabelt, glöms lätt'}
      ]}] },
    { title:'Tre tumregler',
      text:'Gör dem till rutin, så slipper ni det mesta av krånglet i grupprojektet.',
      cmd:null,
      tools:`Använder ni GitHub kan ni också välja <b>Add .gitignore</b> och mallen <b>VisualStudio</b> när ni skapar repot. Då finns filen från första början.`,
      panels:[{title:'✅ Checklista', badge:{t:'varje projekt', cls:'result'}, lines:[
        {t:'1. Skapa .gitignore innan första commit', cls:'result'},
        {t:'2. Titta på git status innan git add .', cls:'result'},
        {t:'3. Inga lösenord eller nycklar i repot', cls:'result'}
      ]}] }
  ]
};

const LESSONS = [LSTART, L1, LIGNORE, L2, LPULL, L3, LPR, LUNDO];
LESSONS.forEach((l,i) => l.title = (i+1) + ' · ' + l.name);

/* ===================== SCENER ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');

/* ----- Scen: places (rutor med föremål som flyttar sig) ----- */
const places = (() => {
  let slots = [], arrowEls = [], els = {}, layer;
  const IH = 78, GAP = 8;

  function build(lesson){
    slots = []; arrowEls = []; els = {};
    lesson.boxes.forEach((b,i) => {
      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = '<div class="box-head"><div class="ic">'+b.icon+'</div><div><div class="nm">'+b.name+
        '</div><div class="tm">'+b.term+'</div><div class="hint">'+b.hint+'</div></div></div><div class="slot"></div>';
      stage.appendChild(box);
      const slot = box.querySelector('.slot');
      let rows = 1;
      lesson.steps.forEach(st => {
        const n = st.items.filter(it => it.box === i).length;
        if (n > rows) rows = n;
      });
      if (rows > 1) slot.style.minHeight = (rows * (IH + GAP) - GAP) + 'px';
      slots.push(slot);
      if (i < lesson.arrows.length) {
        const a = document.createElement('div');
        a.className = 'arrow';
        const ar = lesson.arrows[i], at = typeof ar === 'string' ? ar : ar.t, ag = (ar && ar.g) || '→';
        a.innerHTML = '<span class="glyph">'+ag+'</span><span>'+at+'</span>';
        stage.appendChild(a);
        arrowEls.push(a);
      }
    });
    layer = document.createElement('div');
    layer.id = 'items';
    stage.appendChild(layer);
  }
  function place(box, idx){
    const s = stage.getBoundingClientRect(), r = slots[box].getBoundingClientRect();
    return {x:r.left - s.left - stage.clientLeft, y:r.top - s.top - stage.clientTop + idx*(IH+GAP), w:r.width};
  }
  function setPos(el, p){
    el.style.width = p.w + 'px';
    el.style.transform = 'translate('+p.x+'px,'+p.y+'px)';
  }
  function make(){
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = '<div class="t"></div><div class="s"></div><div class="b"></div>';
    return el;
  }
  function update(el, it){
    el.querySelector('.t').textContent = it.icon + ' ' + it.t;
    el.querySelector('.s').textContent = it.s;
    el.querySelector('.b').textContent = it.b;
    const changed = el.dataset.cls !== it.cls;
    el.dataset.cls = it.cls;
    el.classList.remove('changed','staged','commit','remote');
    el.classList.add(it.cls);
    if (changed && el.dataset.init) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    el.dataset.init = '1';
  }
  function render(st){
    const present = new Set(), counts = {};
    st.items.forEach(it => {
      present.add(it.id);
      const idx = counts[it.box] = (counts[it.box] === undefined ? 0 : counts[it.box] + 1);
      let el = els[it.id];
      if (!el) {
        el = els[it.id] = make();
        layer.appendChild(el);
        setPos(el, place(it.from !== undefined ? it.from : it.box, 0));
        el.style.opacity = it.from !== undefined ? 1 : 0;
        void el.offsetWidth;
      }
      update(el, it);
      setPos(el, place(it.box, idx));
      el.style.opacity = 1;
    });
    Object.keys(els).forEach(id => {
      if (!present.has(id)) {
        const el = els[id];
        el.style.opacity = 0;
        delete els[id];
        setTimeout(() => el.remove(), 500);
      }
    });
    arrowEls.forEach((a,i) => a.classList.toggle('on', st.arrow === 'all' || st.arrow === i));
  }
  return {build, render};
})();

/* ----- Scen: branches (spår med sparpunkter och merge-pilar) ----- */
const branches = (() => {
  let LY = {}, root;
  const cx = c => 160 + 80*c;
  const R = 15;

  function build(lesson){
    const g = lesson.graph, N = {};
    g.nodes.forEach(n => N[n.id] = n);
    LY = {};
    g.lanes.forEach((l,i) => LY[l.id] = 50 + 80*i);
    const H = 50 + 80*(g.lanes.length - 1) + 50;
    const un = o => o.until !== undefined ? ' data-until="'+o.until+'"' : '';
    let h = '<svg viewBox="0 0 700 '+H+'" role="img" aria-label="Grenar i Git">';
    g.lanes.forEach(l => {
      const y = LY[l.id];
      h += '<g class="lane c-'+l.id+'" data-at="'+l.at+'"><line x1="124" x2="690" y1="'+y+'" y2="'+y+'"/>'+
           '<text class="ln" x="12" y="'+(y-1)+'">'+l.id+'</text><text class="ld" x="12" y="'+(y+18)+'">'+l.desc+'</text></g>';
    });
    g.edges.forEach(e => {
      const a = N[e.from], b = N[e.to];
      const x1 = cx(a.col), y1 = LY[a.lane], x2 = cx(b.col), y2 = LY[b.lane];
      let d;
      if (y1 === y2 || x1 === x2) d = 'M'+x1+' '+y1+'L'+x2+' '+y2;
      else { const dx = (x2-x1)*0.55; d = 'M'+x1+' '+y1+'C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2; }
      h += '<g class="edge c-'+e.c+(e.dashed ? ' dashed' : '')+'" data-at="'+e.at+'"'+un(e)+'><path d="'+d+'" pathLength="1"/>';
      if (e.merge) {
        const tx = x2 - R - 1;
        h += '<polygon points="'+tx+','+y2+' '+(tx-11)+','+(y2-7)+' '+(tx-11)+','+(y2+7)+'"/>';
      }
      if (e.label) h += '<text class="elabel" x="'+((x1+x2)/2 + (y1 === y2 ? 0 : 42))+'" y="'+((y1+y2)/2 + (y1 === y2 ? -8 : 24))+'">'+e.label+'</text>';
      h += '</g>';
    });
    g.nodes.forEach(n => {
      h += '<g class="node c-'+n.lane+'" data-at="'+n.at+'"'+(n.solid !== undefined ? ' data-solid="'+n.solid+'"' : '')+
           ' transform="translate('+cx(n.col)+','+LY[n.lane]+')"><circle r="'+R+'"/><text y="'+(R+18)+'">'+n.t+'</text></g>';
    });
    (g.clouds || []).forEach(c => {
      const n = N[c.node];
      h += '<text class="cloud" data-at="'+c.at+'"'+un(c)+' x="'+cx(n.col)+'" y="'+(LY[n.lane]-24)+'">☁️</text>';
    });
    (g.tags || []).forEach(t => {
      const n = N[t.node];
      h += '<text class="tag" data-at="'+t.at+'"'+un(t)+' x="'+cx(n.col)+'" y="'+(LY[n.lane]-48)+'">'+t.text+'</text>';
    });
    h += '<g class="head" id="head" style="transform:translate(588px,'+LY[g.lanes[g.lanes.length > 3 ? 2 : 0].id]+'px)">'+
         '<rect x="0" y="-14" width="104" height="28" rx="14"/><text x="52" y="5">📍 Du är här</text></g></svg>';
    stage.innerHTML = h;
    root = stage.querySelector('svg');
  }
  function render(st, idx){
    root.querySelectorAll('[data-at]').forEach(el => {
      const at = +el.dataset.at, until = el.dataset.until === undefined ? Infinity : +el.dataset.until;
      el.classList.toggle('show', at <= idx && idx < until);
      if (el.dataset.solid !== undefined) el.classList.toggle('ghost', idx < +el.dataset.solid);
    });
    if (st.head) root.querySelector('#head').style.transform = 'translate(588px,'+LY[st.head]+'px)';
  }
  return {build, render};
})();

/* ----- Scen: editor (kodpaneler och terminal) ----- */
const editor = (() => {
  let panelsEl;
  function build(){
    stage.innerHTML = '<div class="panels"></div>';
    panelsEl = stage.querySelector('.panels');
  }
  function render(st){
    panelsEl.innerHTML = '';
    panelsEl.className = 'panels' + (st.panels.length > 1 ? ' two' : '');
    let d = 0;
    st.panels.forEach(p => {
      const el = document.createElement('div');
      el.className = 'panel' + (p.kind === 'term' ? ' term' : '');
      const h = document.createElement('div');
      h.className = 'panel-h';
      const t = document.createElement('span');
      t.textContent = p.title;
      h.appendChild(t);
      if (p.badge) {
        const b = document.createElement('span');
        b.className = 'br ' + p.badge.cls;
        b.textContent = p.badge.t;
        h.appendChild(b);
      }
      el.appendChild(h);
      const code = document.createElement('div');
      code.className = 'code';
      p.lines.forEach(l => {
        const row = document.createElement('div');
        row.className = 'cl ' + l.cls;
        row.style.animationDelay = (d++ * 90) + 'ms';
        const c = document.createElement('code');
        c.textContent = l.t;
        row.appendChild(c);
        if (l.note) {
          const n = document.createElement('span');
          n.className = 'nt';
          n.textContent = l.note;
          row.appendChild(n);
        }
        code.appendChild(row);
      });
      el.appendChild(code);
      panelsEl.appendChild(el);
    });
  }
  return {build, render};
})();

const SCENES = {places, branches, editor};

/* ===================== STYRNING ===================== */
let li = 0, lesson = LESSONS[0], STEPS = lesson.steps, scene = places, cur = 0, timer = null;

let tool = 'vscode';
try { const t = localStorage.getItem('gitguide.tool'); if (TOOLS.some(x => x[0] === t)) tool = t; } catch(e){}

function renderTool(){
  const st = STEPS[cur];
  const label = TOOLS.find(t => t[0] === tool)[1];
  $('#who').textContent = 'Så gör du i ' + label;
  $('#toolbody').innerHTML = typeof st.tools === 'string' ? st.tools : st.tools[tool];
  document.querySelectorAll('#tools .tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tool === tool)));
}

function go(n){
  cur = Math.max(0, Math.min(STEPS.length - 1, n));
  const st = STEPS[cur];
  scene.render(st, cur);
  $('#stepno').textContent = lesson.title + ' · steg ' + (cur+1) + ' av ' + STEPS.length;
  $('#title').textContent = st.title;
  $('#text').textContent = st.text;
  const cmd = Array.isArray(st.cmd) ? st.cmd.join('\n') : st.cmd;
  $('#cmdbox').hidden = !cmd;
  if (cmd) { $('#cmd').textContent = cmd; $('#cmdnote').textContent = '← ' + st.note; }
  document.querySelectorAll('.dot').forEach((d,i) => i === cur ? d.setAttribute('aria-current','step') : d.removeAttribute('aria-current'));
  $('#prev').disabled = cur === 0;
  $('#next').textContent = cur === STEPS.length - 1 ? 'Börja om ↺' : 'Nästa →';
  renderTool();
}

function setPlay(on){
  clearInterval(timer); timer = null;
  $('#play').textContent = on ? '⏸ Pausa' : '▶ Spela upp';
  $('#play').setAttribute('aria-pressed', String(on));
  if (on) {
    if (cur === STEPS.length - 1) go(0);
    timer = setInterval(() => { if (cur >= STEPS.length - 1) setPlay(false); else go(cur + 1); }, 4500);
  }
}

function loadLesson(i){
  setPlay(false);
  li = i; lesson = LESSONS[i]; STEPS = lesson.steps; scene = SCENES[lesson.scene];
  stage.className = 'stage ' + lesson.scene;
  stage.innerHTML = '';
  scene.build(lesson);
  $('#dots').innerHTML = '';
  STEPS.forEach((s,k) => {
    const d = document.createElement('button');
    d.className = 'dot'; d.type = 'button'; d.setAttribute('aria-label','Steg ' + (k+1));
    d.onclick = () => go(k);
    $('#dots').appendChild(d);
  });
  document.querySelectorAll('.ltab').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.lesson === i)));
  try { history.replaceState(null, '', '#' + (i+1)); } catch(e){}
  go(0);
}

/* lektionsflikar */
LESSONS.forEach((l,i) => {
  const b = document.createElement('button');
  b.className = 'ltab'; b.type = 'button'; b.setAttribute('role','tab');
  b.dataset.lesson = i; b.textContent = l.title;
  b.onclick = () => loadLesson(i);
  $('#lessons').appendChild(b);
});

/* verktygsflikar */
TOOLS.forEach(([key,label]) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.type = 'button'; b.setAttribute('role','tab');
  b.dataset.tool = key; b.textContent = label;
  b.onclick = () => { tool = key; try { localStorage.setItem('gitguide.tool', key); } catch(e){} renderTool(); };
  $('#tools').appendChild(b);
});

/* kontroller */
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur === STEPS.length - 1 ? 0 : cur + 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('#next').click();
  if (e.key === 'ArrowLeft') $('#prev').click();
});
$('#play').onclick = () => setPlay(!timer);
$('#copy').onclick = async () => {
  const st = STEPS[cur], text = Array.isArray(st.cmd) ? st.cmd.join('\n') : st.cmd;
  try {
    await navigator.clipboard.writeText(text);
    $('#copy').textContent = 'Kopierat ✓';
    setTimeout(() => $('#copy').textContent = 'Kopiera', 1500);
  } catch(e){}
};

let rt, lastW = innerWidth;
function relayout(force){
  /* Bara scenen med absolutpositionerade föremål behöver räkna om, och bara när bredden ändras
     (på mobil skickas resize även när adressfältet gömms). */
  if (scene !== places) return;
  if (!force && innerWidth === lastW) return;
  lastW = innerWidth;
  stage.classList.add('no-anim');
  go(cur);
  void stage.offsetWidth;
  clearTimeout(rt);
  rt = setTimeout(() => stage.classList.remove('no-anim'), 60);
}
addEventListener('resize', () => relayout(false));
addEventListener('load', () => relayout(true));

const startLesson = Math.max(0, Math.min(LESSONS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
loadLesson(startLesson);
</script>

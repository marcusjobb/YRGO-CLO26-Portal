<script>
/* ══════════════════════════════════════════════════════
   helpers
══════════════════════════════════════════════════════ */
function isoWeek(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
  const y0 = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  return Math.ceil((((dt - y0) / 86400000) + 1) / 7);
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function hl(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if (i === -1) return text;
  return text.slice(0,i) + '<mark class="search-hit">' + text.slice(i, i+q.length) + '</mark>' + text.slice(i+q.length);
}

/* ══════════════════════════════════════════════════════
   state
══════════════════════════════════════════════════════ */
let KURS = null;
let activeWeekNr = null;
const currentWeek = isoWeek(new Date());

/* ══════════════════════════════════════════════════════
   sidebar
══════════════════════════════════════════════════════ */
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  const allWeeks  = KURS.veckor.map(v => v.nr);
  const doneCount = allWeeks.filter(w => w < currentWeek).length;
  const total     = allWeeks.length;

  const head = el('div','sb-head');
  head.innerHTML = `
    <div class="sb-eyebrow">${KURS.kod} · Kurs ${KURS.nummer}</div>
    <div class="sb-title">${KURS.namn}</div>
    <div class="sb-progress-bar"><div class="sb-progress-fill" style="width:${Math.round(doneCount/total*100)}%"></div></div>
    <div class="sb-progress-meta"><span>${doneCount} av ${total} veckor klara</span><span>${KURS.period}</span></div>`;
  sb.appendChild(head);

  const scroll = el('div','sb-scroll');

  const wSec = el('div');
  wSec.appendChild(el('span','sb-section-label','Veckor'));
  const wList = el('ul','sb-week-list');

  KURS.veckor.forEach(v => {
    const state = v.nr < currentWeek ? 'past' : v.nr === currentWeek ? 'current' : 'future';
    const li = el('li');
    const a  = el('a');
    a.className = 'sb-week-item'
      + (state === 'past' ? ' is-past' : '')
      + (state === 'current' ? ' is-current' : '')
      + (v.nr === activeWeekNr ? ' is-selected' : '');
    a.setAttribute('data-nr', v.nr);
    a.innerHTML = `<span class="sb-dot"></span><span class="sb-wnr">v${v.nr}</span><span class="sb-wname">${v.titel}</span>${state==='current'?'<span class="sb-now-chip">NU</span>':''}`;
    a.addEventListener('click', e => { e.preventDefault(); setWeek(v.nr); });
    li.appendChild(a);
    wList.appendChild(li);
  });
  wSec.appendChild(wList);
  scroll.appendChild(wSec);

  if (KURS.links?.length) {
    const lSec = el('div');
    lSec.appendChild(el('span','sb-section-label','Snabblänkar'));
    const lList = el('ul','sb-link-list');
    KURS.links.forEach(lk => {
      const li = el('li');
      li.innerHTML = `<a class="sb-link" href="${lk.href}" target="_blank" rel="noopener"><span class="sb-link-icon">${lk.icon}</span>${lk.label}</a>`;
      lList.appendChild(li);
    });
    lSec.appendChild(lList);
    scroll.appendChild(lSec);
  }

  sb.appendChild(scroll);

  const gBox = el('div','sb-grade');
  gBox.innerHTML = `<div class="sb-grade-label">Betygskriterier</div>
    <div class="sb-grade-row"><span class="sb-badge sb-badge-g">G</span><span class="sb-grade-desc">${KURS.betyg.G}</span></div>
    <div class="sb-grade-row"><span class="sb-badge sb-badge-vg">VG</span><span class="sb-grade-desc">${KURS.betyg.VG}</span></div>`;
  sb.appendChild(gBox);
}

/* ══════════════════════════════════════════════════════
   main head
══════════════════════════════════════════════════════ */
function buildHead() {
  document.getElementById('main-head').innerHTML = `
    <div class="main-eyebrow">${KURS.kod} · Kurs ${KURS.nummer} · ${KURS.period}</div>
    <div class="main-title">${KURS.namn}</div>
    <div class="main-meta">
      <span>📅 ${KURS.datum}</span>
      <span>📍 ${KURS.schema}</span>
      <span>ℹ️ ${KURS.notering}</span>
    </div>`;
}

/* ══════════════════════════════════════════════════════
   legend
══════════════════════════════════════════════════════ */
function buildLegend() {
  const bar = document.getElementById('legend-bar');
  bar.innerHTML = `<span class="legend-pre">Nivå</span>
    <button class="pill g" data-cls="g" aria-pressed="true">● Måste</button>
    <button class="pill a" data-cls="a" aria-pressed="true">● Välj ett</button>
    <button class="pill r" data-cls="r" aria-pressed="true">● Utmaning</button>`;
  bar.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', on ? 'false' : 'true');
      document.body.classList.toggle('hide-' + btn.dataset.cls, on);
    });
  });
}

/* ══════════════════════════════════════════════════════
   render one ämne-card
══════════════════════════════════════════════════════ */
function renderAmne(amne, base, q) {
  const card = el('div','amne-card');

  // head
  const head = el('div','amne-head');
  head.appendChild(el('div','amne-titel', hl(amne.titel, q)));
  if (amne.beskrivning) head.appendChild(el('div','amne-beskr', hl(amne.beskrivning, q)));

  if (amne.tags?.length) {
    const tagsEl = el('div','amne-tags');
    amne.tags.forEach(t => {
      const tag = el('button','tag' + (q && t.toLowerCase() === q ? ' is-active' : ''), t);
      tag.addEventListener('click', () => {
        const inp = document.getElementById('sok');
        inp.value = inp.value.trim().toLowerCase() === t.toLowerCase() ? '' : t;
        inp.dispatchEvent(new Event('input'));
      });
      tagsEl.appendChild(tag);
    });
    head.appendChild(tagsEl);
  }
  card.appendChild(head);

  // body
  const body = el('div','amne-body');

  // resource links (lektion + notes)
  const resources = [];
  if (amne.lektion) resources.push({ icon:'📊', label: amne.lektion.text, href: base + amne.lektion.href });
  const notesArr = Array.isArray(amne.notes) ? amne.notes : (amne.notes ? [amne.notes] : []);
  notesArr.forEach(n => resources.push({ icon:'📝', label: n.text, href: base + n.href }));

  if (resources.length) {
    const resEl = el('div','amne-resources');
    resources.forEach(r => {
      resEl.innerHTML += `<a class="res-link" href="${r.href}" target="_blank" rel="noopener"><span class="res-icon">${r.icon}</span>${hl(r.label, q)}</a>`;
    });
    body.appendChild(resEl);
  }

  // examples
  if (amne.examples?.length) {
    const exEl = el('div','amne-resources amne-examples');
    amne.examples.forEach(ex => {
      exEl.innerHTML += `<a class="res-link res-link-ex" href="${base + ex.href}" target="_blank" rel="noopener"><span class="res-icon">💻</span>${hl(ex.text, q)}</a>`;
    });
    body.appendChild(exEl);
  }

  // övningar
  const ovs = amne.ovningar;
  const allOvs = [
    ...(ovs.green||[]).map(o => ({...o, niva:'green'})),
    ...(ovs.amber||[]).map(o => ({...o, niva:'amber'})),
    ...(ovs.red  ||[]).map(o => ({...o, niva:'red'})),
  ];

  if (allOvs.length) {
    const ovEl = el('div','amne-ovningar');
    allOvs.forEach(o => {
      const row = el('div','ov-row ' + o.niva);
      const descHtml = o.desc ? `<span class="ov-desc">${hl(o.desc, q)}</span>` : '';
      row.innerHTML = `<span class="ov-dot"></span><a href="${base + o.href}" target="_blank" rel="noopener">${hl(o.text, q)}</a>${descHtml}`;
      ovEl.appendChild(row);
    });
    body.appendChild(ovEl);
  }

  card.appendChild(body);
  return card;
}

/* ══════════════════════════════════════════════════════
   show one week
══════════════════════════════════════════════════════ */
function setWeek(nr) {
  activeWeekNr = nr;
  // clear search
  document.getElementById('sok').value = '';
  document.getElementById('sok-count').textContent = '';
  // update sidebar highlight
  document.querySelectorAll('.sb-week-item').forEach(a => {
    a.classList.toggle('is-selected', +a.dataset.nr === nr);
  });
  renderWeekView();
}

function renderWeekView() {
  const view  = document.getElementById('week-view');
  const base  = KURS.githubBase;
  const veckor = KURS.veckor;
  const idx   = veckor.findIndex(v => v.nr === activeWeekNr);
  const v     = veckor[idx];
  if (!v) return;

  view.innerHTML = '';

  // nav bar
  const nav = el('div','wv-nav');
  const prevBtn = el('button','wv-nav-btn','←');
  prevBtn.disabled = idx === 0;
  prevBtn.addEventListener('click', () => setWeek(veckor[idx-1].nr));
  const nextBtn = el('button','wv-nav-btn','→');
  nextBtn.disabled = idx === veckor.length - 1;
  nextBtn.addEventListener('click', () => setWeek(veckor[idx+1].nr));

  nav.appendChild(prevBtn);
  nav.appendChild(el('span','wv-week-badge','v' + v.nr));
  nav.appendChild(el('span','wv-week-title', v.titel));
  if (v.tid) nav.appendChild(el('span','wv-week-meta','⏱ ' + v.tid));
  nav.appendChild(nextBtn);
  view.appendChild(nav);

  // goal
  if (v.mal) view.appendChild(el('div','wv-goal', '🎯 ' + v.mal));

  // deadline
  if (v.deadline) {
    view.appendChild(el('div','wv-deadline', '📌 ' + v.deadline));
  }

  // coming soon
  if (v.comingSoon) {
    view.appendChild(el('div','wv-coming', v.comingSoon));
    return;
  }

  // ämnen
  if (v.amnen?.length) {
    const list = el('div','amnen-list');
    v.amnen.forEach(a => list.appendChild(renderAmne(a, base, '')));
    view.appendChild(list);
  }

  // tentafrågor
  if (v.tentafragor?.length) {
    const tf = el('div','wv-tentafragor');
    tf.appendChild(el('div','tentafragor-label','Tentafrågor'));
    const tfl = el('div','tentafragor-list');
    v.tentafragor.forEach(t => {
      tfl.innerHTML += `<a class="tentafragor-link" href="${base + t.href}" target="_blank" rel="noopener">${t.text}</a>`;
    });
    tf.appendChild(tfl);
    view.appendChild(tf);
  }

  // tenta table
  if (v.tenta) {
    const box = el('div','wv-tenta');
    const tbl = el('table','tenta-tbl');
    v.tenta.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${row.dag}</td><td>${row.isTenta ? '<span class="tenta-badge">TENTA</span> ' + row.info.replace('TENTA ','').replace('09:00–11:00',' 09:00–11:00') : row.info}</td>`;
      tbl.appendChild(tr);
    });
    box.appendChild(tbl);
    if (v.tentaChips) {
      const chips = el('div','score-chips');
      v.tentaChips.forEach(c => chips.appendChild(el('span','score-chip',c)));
      box.appendChild(chips);
    }
    view.appendChild(box);
  }
}

/* ══════════════════════════════════════════════════════
   search (cross-week)
══════════════════════════════════════════════════════ */
function itemSearchStr(item) {
  return [item.text, item.desc || '', ...(item.tags || [])].join(' ').toLowerCase();
}
function resourceSearchStr(r) {
  return r ? [r.text, ...(r.tags || [])].join(' ').toLowerCase() : '';
}

function runSearch(q) {
  const view     = document.getElementById('week-view');
  const countEl  = document.getElementById('sok-count');
  const base     = KURS.githubBase;

  if (!q) {
    countEl.textContent = '';
    renderWeekView();
    return;
  }

  view.innerHTML = '';
  let totalHits = 0;
  let weekHits  = 0;

  KURS.veckor.forEach(v => {
    const matchingAmnen = (v.amnen || []).filter(a => {
      const haystack = [
        a.titel, a.beskrivning,
        ...(a.tags || []),
        resourceSearchStr(a.lektion),
        ...(Array.isArray(a.notes) ? a.notes.map(resourceSearchStr) : [resourceSearchStr(a.notes)]),
        ...(a.examples || []).map(itemSearchStr),
        ...(a.ovningar?.green || []).map(itemSearchStr),
        ...(a.ovningar?.amber || []).map(itemSearchStr),
        ...(a.ovningar?.red   || []).map(itemSearchStr),
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });

    if (!matchingAmnen.length) return;

    weekHits++;
    totalHits += matchingAmnen.length;

    const group = el('div','search-week-group');
    group.appendChild(el('div','search-week-heading', `v${v.nr} — ${v.titel}`));
    const list = el('div','amnen-list');
    matchingAmnen.forEach(a => list.appendChild(renderAmne(a, base, q)));
    group.appendChild(list);
    view.appendChild(group);
  });

  if (totalHits === 0) {
    view.appendChild(el('div','wv-empty','Inga träffar. Prova ett kortare sökord.'));
    countEl.textContent = '';
  } else {
    countEl.textContent = `${totalHits} ämne${totalHits!==1?'n':''} i ${weekHits} vecka${weekHits!==1?'r':''}`;
  }
}

/* ══════════════════════════════════════════════════════
   search wiring
══════════════════════════════════════════════════════ */
function initSearch() {
  const input    = document.getElementById('sok');
  const clearBtn = document.getElementById('sok-clear');
  input.addEventListener('input', () => runSearch(input.value.trim().toLowerCase()));
  clearBtn.addEventListener('click', () => {
    input.value = '';
    runSearch('');
    input.focus();
  });
}

/* ══════════════════════════════════════════════════════
   boot
══════════════════════════════════════════════════════ */
fetch('kurs-01.json')
  .then(r => r.json())
  .then(data => {
    KURS = data;
    // pick active week: current if in range, else first
    const nrs = KURS.veckor.map(v => v.nr);
    activeWeekNr = nrs.includes(currentWeek) ? currentWeek : nrs[0];

    buildHead();
    buildLegend();
    buildSidebar();
    initSearch();
    renderWeekView();
  })
  .catch(() => {
    document.getElementById('week-view').innerHTML =
      '<div class="wv-empty">⚠️ Kunde inte ladda kurs-01.json — kör via http-server, inte file://</div>';
  });
</script>
